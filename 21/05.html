<!DOCTYPE html>
<html>
  <head>
    <title>Accessing CSS Properties</title>
    <script src='OSC.js'></script>
  </head>
  <body>
    <div id='object'>Div Object</div>

    <script>
      // S('object').overflow = 'scroll'
      // S('object').textTransform = 'uppercase'
      S('object').alignItems = 'center'
      S('object').background = '#eee'
      S('object').border     = 'solid 1px red'
      S('object').color      = 'blue'
      S('object').cursor = 'text'
      S('object').display    = 'flex'
      S('object').fontFamily = 'Helvetica'
      S('object').fontSize   = '15pt'
      S('object').fontStyle  = 'italic'
      S('object').fontVariant = 'small-caps'
      S('object').fontWeight = 'bold'
      S('object').height     = '140px'
      S('object').justifyContent = 'center'
      S('object').letterSpacing = '2px'
      S('object').lineHeight = '1.5em'
      S('object').textAlign = 'center'
      S('object').textDecoration = 'underline'
      S('object').verticalAlign = 'middle'
      S('object').visibility = 'visible'
      S('object').whiteSpace = 'pre'
      S('object').width      = '200px'
      S('object').wordSpacing = '2px'
    </script> 
  </body>
</html>
