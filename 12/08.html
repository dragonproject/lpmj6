  <body>
    <h2>セレクトボックス（複数選択）の操作</h2>

    <form id="multiVegForm" method="post" action="multi_veg_result.php">
      <pre>
    野菜:
        <select name="veg[]" size="5" multiple="multiple">
            <option value="Peas">Peas</option>
            <option value="Beans" selected="selected">Beans</option>
            <option value="Carrots">Carrots</option>
            <option value="Cabbage">Cabbage</option>
            <option value="Broccoli" selected="selected">Broccoli</option>
        </select>
    <input type="submit" value="送信">
  </pre>
    </form>

    <hr />
    <h3>参考： JavaScript で複数選択値を取得する例</h3>
    <button id="btnMultiSelect">選択中の野菜をアラートで表示</button>
    <div id="msg"></div>

    <script>
      const multiVegSelect = document.getElementById("multiVegForm").veg;
      const btnMultiSelect = document.getElementById("btnMultiSelect");
      const msgBox = document.getElementById("msg");

      btnMultiSelect.addEventListener("click", function () {
        // 配列形式の名前('veg[]')に対応した選択値の取得方法
        const selectedOptions = Array.from(multiVegSelect.options).filter(
          (option) => option.selected,
        );

        if (selectedOptions.length === 0) {
          msgBox.textContent =
            "野菜が選択されていません。Ctrlキー（Windows）またはCmdキー（Mac）を押しながらクリックして複数選択してください。";
          return;
        }

        const selectedValues = selectedOptions.map((option) => option.value);
        const selectedTexts = selectedOptions.map(
          (option) => option.textContent,
        );

        const message =
          "現在選択中の野菜: " +
          selectedValues.join(", ") +
          " (合計 " +
          selectedOptions.length +
          " 個)";
        msgBox.textContent = message;
        alert(message);
      });
    </script>
  </body>
</html>
